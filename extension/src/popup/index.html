<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PM-App QA Feedback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        width: 320px;
        font-family: system-ui, sans-serif;
      }
      /* F299 (AS-570): a real, explicit, guaranteed visible focus
         indicator on every keyboard-focusable control in the popup —
         does not rely on an unstyled browser default (which is real but
         not something this codebase asserts or controls). Applies to
         every interactive element (buttons, inputs, selects, the
         annotation canvas itself) via :focus-visible so it only shows for
         keyboard/programmatic focus, not for a mouse click, matching how
         real browsers already draw default focus rings. */
      :focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
