name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 20.9 is what Next declares as its floor, but it is below what the
          # test runner actually needs: vitest's rolldown dependency imports
          # `styleText` from node:util, which landed in 20.12, so vitest fails
          # to start at all on 20.9 ("does not provide an export named
          # 'styleText'"). 24.x is the active LTS line and is what vitest's
          # own engines field allows (^20 || ^22 || >=24).
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `next typegen` writes the route/layout types (LayoutProps, PageProps,
      # ...) that app code references into .next/types. Without it, tsc here
      # fails on `Cannot find name 'LayoutProps'` — it passes locally only
      # because a previous `next dev`/`next build` left .next in place. The
      # Build step below regenerates these anyway; this makes the earlier
      # Type-check step self-sufficient rather than order-dependent.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # W6: CI no longer points at the shared production Supabase project
      # (see missions/20260828-hardening/plan.md "W6" and
      # missions/20260828-hardening/handoffs/W6-handoff.md). Instead it
      # starts an ephemeral local Supabase stack via the CLI, which
      # replays all committed migrations from supabase/migrations against
      # a throwaway Postgres + Auth + Storage instance in Docker (already
      # present on ubuntu-latest runners), then reads the generated URL
      # and keys back out with `supabase status -o env`. No repository
      # secrets, no shared-tenant Auth rate limits, no risk to real user
      # data. The Supabase CLI is installed explicitly below rather than
      # assumed preinstalled, per the CLI's own GitHub Actions guide:
      # https://supabase.com/docs/guides/local-development/cli/getting-started#running-supabase-locally
      # and https://supabase.com/docs/guides/cli/github-action/config-diff
      - name: Setup Supabase CLI
        # Verified current major version via
        # https://github.com/supabase/setup-cli (README, 2026-08-28):
        # latest release is v3.x; `@v3` is the correct tag (not `@v1`).
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Export local Supabase env vars
        # `supabase status -o env --override-name` maps the CLI's local
        # connection info onto the exact env var names the app and test
        # suite expect (NEXT_PUBLIC_SUPABASE_URL, the publishable/anon
        # key, and the secret/service_role key), appending them to
        # $GITHUB_ENV so every later step in this job inherits them.
        # Verified against `supabase status --help` (v2.x, 2026-08-28):
        # the -o env / --override-name flags exist for exactly this
        # purpose. Local dev keys are fixed, well-known demo JWTs (not
        # secrets) baked into the CLI/Docker images, so no repository
        # secret is needed here.
        #
        # `-o env` formats every `KEY=VALUE` line shell-quoted (e.g.
        # `NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"`, quotes
        # included), which is correct for `source`-ing into a shell but
        # is NOT what $GITHUB_ENV expects: the runner's env-file parser
        # takes everything after the first `=` on a single-line entry
        # literally, quotes and all. Appending the CLI's raw output
        # straight into $GITHUB_ENV therefore set every one of these
        # vars (and the many other unprefixed ones the CLI also emits,
        # e.g. DB_URL/JWT_SECRET) to a value wrapped in a literal pair
        # of double quotes -- so `new URL('"http://127.0.0.1:54321"')`
        # (leading `"` is not `http`) failed
        # supabase-js's own `validateSupabaseUrl` with "Invalid
        # supabaseUrl: Must be a valid HTTP or HTTPS URL." everywhere a
        # client was constructed from these env vars. `next build`
        # didn't surface this because it only inlines the raw string
        # into the client bundle at build time without constructing a
        # client eagerly. The `sed` below strips a single matching pair
        # of leading/trailing double quotes from each line's value
        # before the line reaches $GITHUB_ENV.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Build
        # F278-style hard-fail intent preserved: NEXT_PUBLIC_SUPABASE_URL /
        # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY / SUPABASE_SECRET_KEY are now
        # always present (from the local stack above) rather than
        # conditionally-present repository secrets, so `npm run build` and
        # every step below always has real credentials to build/test
        # against — it can no longer silently run without them.
        run: npm run build

      - name: Unit + integration tests
        # F278: same command the local pre-worker-exit hook runs (see
        # tech-decisions.md "How to run tests"), kept in sync intentionally.
        # Runs against the local Supabase stack started above instead of
        # production. tests/integration/*.test.ts and tests/e2e/*.spec.ts
        # still hard-fail (rather than skip) when `CI` is set and these
        # vars are missing — that behaviour is unchanged, only the source
        # of the vars changed from repo secrets to the local stack.
        #
        # Five catalog suites (f016i-anon-execute-catalog,
        # f016l-public-table-rls-catalog, f025-portal-table-triple-sweep,
        # f025e-guard-hardening, overdue-notification-sweep) introspect the
        # REAL hosted project through the Supabase Management API — grants,
        # RLS membership, cron jobs — which the local stack cannot stand in
        # for. They deliberately hard-throw rather than skip when CI is set
        # and these are absent, so that "not run" can never be mistaken for
        # "passed". Until both repository secrets exist those five fail by
        # design; every other suite is unaffected.
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run test

      - name: End-to-end tests (Playwright)
        run: |
          npx playwright install --with-deps
          npx playwright test

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
