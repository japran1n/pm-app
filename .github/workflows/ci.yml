name: CI

on:
  push:
  pull_request:

# The five Management-API catalog suites introspect and briefly mutate the
# REAL hosted Supabase project (adding and dropping a probe column on
# public.projects, for one). Two runs doing that at once corrupt each
# other: run 33857487411 failed f020b's self-maintaining-guard assertion
# purely because a concurrent rerun was probing the same table, and the
# test passed alone immediately afterwards. Serialise runs on this branch
# so that cannot recur. Queued runs are not cancelled -- each push's result
# is still reported.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Least privilege for the default GITHUB_TOKEN in every job below.
permissions:
  contents: read

jobs:
  # Secret scanning (audit 2026-09-24): scripts/check-no-secret-key.mjs only
  # catches HS256 JWT-format keys. gitleaks' default ruleset also covers
  # generic JWTs (session access tokens), private keys, cloud credentials,
  # etc.; .gitleaks.toml adds Supabase sb_secret_ / sbp_ rules and the
  # allow-list. Official action, pinned to the v3.0.0 commit SHA (verified
  # via `git ls-remote https://github.com/gitleaks/gitleaks-action` on
  # 2026-09-24); gitleaks binary pinned to 8.30.1 (latest release that day,
  # https://github.com/gitleaks/gitleaks/releases). No GITLEAKS_LICENSE
  # needed: this repo belongs to a personal account (action README).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .gitleaks.toml
          # Job token is contents:read only; no PR review comments.
          GITLEAKS_ENABLE_COMMENTS: "false"

  ci-fast:
    name: Fast CI (type + lint + unit tests)
    runs-on: ubuntu-latest
    env:
      # Same heap bump as the main `ci` job — `tsc --noEmit` and `next
      # build`'s internal type check die on ubuntu-latest's default
      # old-space heap size otherwise (see the `ci` job's own NODE_OPTIONS
      # comment above for the run IDs that proved this).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check no secret key committed
        run: node scripts/check-no-secret-key.mjs

      # Same reasoning as the `ci` job's own "Generate Next.js route types"
      # step: without this, tsc fails on `Cannot find name 'LayoutProps'`.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Build
        run: npm run build

      # Unit tests only — no live Supabase stack, no integration/e2e/
      # realtime suites. This job's entire point is a fast, reliable green
      # signal that doesn't depend on `supabase start` or repository
      # secrets, independent of the slower/flakier `ci` job above.
      - name: Unit tests
        run: npx vitest run tests/unit

  extension-check:
    name: Extension CI (type + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Type-check extension
        working-directory: extension
        run: npx tsc --noEmit

      - name: Lint extension
        working-directory: extension
        run: npx eslint .

      # Audit SEC-EXT-07: the build used to throw on every CI run because
      # extension/.env (gitignored) does not exist here. VITE_APP_URL now
      # defaults to production in vite.config.ts; the Supabase values are
      # placeholders — this job proves the bundle builds and ships no
      # secret key, it does not produce a publishable artifact. The
      # Playwright suite (extension/tests) is not run here: it needs a
      # headed Chromium with the unpacked extension loaded, a local app on
      # :3000 and live Supabase credentials.
      - name: Build extension
        working-directory: extension
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

  ci:
    runs-on: ubuntu-latest
    env:
      # The repo outgrew Node's default old-space heap on the hosted
      # runner — both `tsc --noEmit` and `next build`'s internal type
      # check die with "Ineffective mark-compacts near heap limit"
      # (runs 34783726179, 34841937567, 34842259793) while passing
      # locally. 6 GB fits comfortably inside ubuntu-latest's memory;
      # applied job-wide so every Node step gets it.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 20.9 is what Next declares as its floor, but it is below what the
          # test runner actually needs: vitest's rolldown dependency imports
          # `styleText` from node:util, which landed in 20.12, so vitest fails
          # to start at all on 20.9 ("does not provide an export named
          # 'styleText'"). 24.x is the active LTS line and is what vitest's
          # own engines field allows (^20 || ^22 || >=24).
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `next typegen` writes the route/layout types (LayoutProps, PageProps,
      # ...) that app code references into .next/types. Without it, tsc here
      # fails on `Cannot find name 'LayoutProps'` — it passes locally only
      # because a previous `next dev`/`next build` left .next in place. The
      # Build step below regenerates these anyway; this makes the earlier
      # Type-check step self-sufficient rather than order-dependent.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      # W6: CI no longer points at the shared production Supabase project
      # (see missions/20260828-hardening/plan.md "W6" and
      # missions/20260828-hardening/handoffs/W6-handoff.md). Instead it
      # starts an ephemeral local Supabase stack via the CLI, which
      # replays all committed migrations from supabase/migrations against
      # a throwaway Postgres + Auth + Storage instance in Docker (already
      # present on ubuntu-latest runners), then reads the generated URL
      # and keys back out with `supabase status -o env`. No repository
      # secrets, no shared-tenant Auth rate limits, no risk to real user
      # data. The Supabase CLI is installed explicitly below rather than
      # assumed preinstalled, per the CLI's own GitHub Actions guide:
      # https://supabase.com/docs/guides/local-development/cli/getting-started#running-supabase-locally
      # and https://supabase.com/docs/guides/cli/github-action/config-diff
      - name: Setup Supabase CLI
        # Verified current major version via
        # https://github.com/supabase/setup-cli (README, 2026-08-28):
        # latest release is v3.x; `@v3` is the correct tag (not `@v1`).
        uses: supabase/setup-cli@v3
        with:
          # Pinned (audit 2026-09-24) instead of `latest` so an upstream CLI
          # release cannot silently change CI behaviour. 2.116.0 is the
          # version in use locally on 2026-09-24; keep in sync with backup.yml.
          version: "2.116.0"

      - name: Start local Supabase stack
        run: supabase start

      # F098 (AS-369): the F097 "restart Realtime after migrations" step
      # that used to run here is removed. It was added on the hypothesis
      # that comment_reactions' post-publication schema change (task_id
      # column + REPLICA IDENTITY FULL added after the table joined
      # supabase_realtime) left Realtime holding a stale relation/schema
      # cache, and that restarting the container after all migrations
      # replayed would force it to reconnect against the final schema and
      # collapse the delivery delay to seconds. The next CI run measured
      # 45364ms post-restart against 45459ms pre-restart (run 33895505689
      # vs the run right after this fix landed) -- no meaningful change,
      # so the stale-schema-cache hypothesis is refuted by the data this
      # step itself produced. See missions/20260903-portal/handoffs/
      # F098-handoff.md for the investigation that replaced it: delivery
      # against the real hosted project is sub-second and does not track
      # an artificially small measurement ceiling, so the client-side
      # test construction is not at fault either -- the remaining
      # explanation is CI-local `supabase start` Realtime-container
      # contention, which a container restart does not relieve.
      - name: Export local Supabase env vars
        # `supabase status -o env --override-name` maps the CLI's local
        # connection info onto the exact env var names the app and test
        # suite expect (NEXT_PUBLIC_SUPABASE_URL, the publishable/anon
        # key, and the secret/service_role key), appending them to
        # $GITHUB_ENV so every later step in this job inherits them.
        # Verified against `supabase status --help` (v2.x, 2026-08-28):
        # the -o env / --override-name flags exist for exactly this
        # purpose. Local dev keys are fixed, well-known demo JWTs (not
        # secrets) baked into the CLI/Docker images, so no repository
        # secret is needed here.
        #
        # `-o env` formats every `KEY=VALUE` line shell-quoted (e.g.
        # `NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"`, quotes
        # included), which is correct for `source`-ing into a shell but
        # is NOT what $GITHUB_ENV expects: the runner's env-file parser
        # takes everything after the first `=` on a single-line entry
        # literally, quotes and all. Appending the CLI's raw output
        # straight into $GITHUB_ENV therefore set every one of these
        # vars (and the many other unprefixed ones the CLI also emits,
        # e.g. DB_URL/JWT_SECRET) to a value wrapped in a literal pair
        # of double quotes -- so `new URL('"http://127.0.0.1:54321"')`
        # (leading `"` is not `http`) failed
        # supabase-js's own `validateSupabaseUrl` with "Invalid
        # supabaseUrl: Must be a valid HTTP or HTTPS URL." everywhere a
        # client was constructed from these env vars. `next build`
        # didn't surface this because it only inlines the raw string
        # into the client bundle at build time without constructing a
        # client eagerly. The `sed` below strips a single matching pair
        # of leading/trailing double quotes from each line's value
        # before the line reaches $GITHUB_ENV.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Build
        # F278-style hard-fail intent preserved: NEXT_PUBLIC_SUPABASE_URL /
        # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY / SUPABASE_SECRET_KEY are now
        # always present (from the local stack above) rather than
        # conditionally-present repository secrets, so `npm run build` and
        # every step below always has real credentials to build/test
        # against — it can no longer silently run without them.
        run: npm run build

      - name: Unit + integration tests
        # F278: same command the local pre-worker-exit hook runs (see
        # tech-decisions.md "How to run tests"), kept in sync intentionally.
        # Runs against the local Supabase stack started above instead of
        # production. tests/integration/*.test.ts and tests/e2e/*.spec.ts
        # still hard-fail (rather than skip) when `CI` is set and these
        # vars are missing — that behaviour is unchanged, only the source
        # of the vars changed from repo secrets to the local stack.
        #
        # Five catalog suites (f016i-anon-execute-catalog,
        # f016l-public-table-rls-catalog, f025-portal-table-triple-sweep,
        # f025e-guard-hardening, overdue-notification-sweep) introspect the
        # REAL hosted project through the Supabase Management API — grants,
        # RLS membership, cron jobs — which the local stack cannot stand in
        # for. They deliberately hard-throw rather than skip when CI is set
        # and these are absent, so that "not run" can never be mistaken for
        # "passed". Until both repository secrets exist those five fail by
        # design; every other suite is unaffected.
        #
        # SECURITY (audit 2026-09-24): the Management API PAT is no longer
        # exposed to this step. It used to be in env for the whole suite
        # (~470 files, any of which could read or log it). The suites that
        # genuinely need it are excluded here and run in their own step
        # below, which is the only place the PAT is present.
        run: >-
          npx vitest run
          --exclude tests/integration/f016i-anon-execute-catalog.test.ts
          --exclude tests/integration/f016j-client-requests-allowlist-guard.test.ts
          --exclude tests/integration/f016l-public-table-rls-catalog.test.ts
          --exclude tests/integration/f020b-projects-allowlist-guard.test.ts
          --exclude tests/integration/f025-portal-table-triple-sweep.test.ts
          --exclude tests/integration/f025e-guard-hardening.test.ts
          --exclude tests/integration/f098-node-meta-rls-policies.test.ts
          --exclude tests/integration/overdue-notification-sweep.test.ts
          --exclude tests/integration/workspace-time-by-person-archived-project-exclusion.test.ts

      # The only step that receives the Supabase Management API PAT: the
      # suites that introspect the real hosted project (grants, RLS, cron)
      # and cannot run against the local stack. Keep this file list in sync
      # with the --exclude list above (`grep -rl SUPABASE_ACCESS_TOKEN
      # tests/integration`).
      # NOTE: f016j / f020b add and drop a probe column on the hosted
      # project — DDL against production from CI. Tracked as a follow-up;
      # they should move to a dedicated staging project.
      - name: Management-API catalog tests (hosted project)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          npx vitest run
          tests/integration/f016i-anon-execute-catalog.test.ts
          tests/integration/f016j-client-requests-allowlist-guard.test.ts
          tests/integration/f016l-public-table-rls-catalog.test.ts
          tests/integration/f020b-projects-allowlist-guard.test.ts
          tests/integration/f025-portal-table-triple-sweep.test.ts
          tests/integration/f025e-guard-hardening.test.ts
          tests/integration/f098-node-meta-rls-policies.test.ts
          tests/integration/overdue-notification-sweep.test.ts
          tests/integration/workspace-time-by-person-archived-project-exclusion.test.ts

      # F092 (AS-369): the four integration tests that wait for a real
      # Supabase Realtime WebSocket event (see
      # tests/realtime-live-delivery-tests.ts) are excluded from the
      # `npm run test` step above and run here instead, alone, after every
      # other vitest worker from that step has exited -- so they no longer
      # contend with 3 other vitest workers and the local `supabase start`
      # Realtime container for the runner's 2 vCPUs. That contention was
      # the measured cause of the 13-20s delivery latency this test class
      # showed when run inside the shared, 4-worker suite.
      # F103 (AS-369): the F099 publication-state dump and F102 replica-
      # identity scratch-table experiment that used to run as separate CI
      # steps here are removed -- both already answered their diagnostic
      # questions, and F102's probe logic now lives, reduced to what the
      # test needs, in tests/helpers/replica-identity-delivery-probe.ts,
      # called from tests/integration/reaction-realtime-delivery.test.ts's
      # own `beforeAll` on every run of this step. See
      # missions/20260903-portal/handoffs/F103-handoff.md.
      # No Management API PAT here: none of the realtime suites use it.
      - name: Realtime integration tests (serial, uncontended)
        run: npm run test:realtime

      - name: End-to-end tests (Playwright)
        # PLAYWRIGHT_PORT=3000: the local stack's GoTrue redirects every
        # magic-link verify to its configured site_url
        # (supabase/config.toml: http://127.0.0.1:3000). With Playwright's
        # default port 3100 the browser followed verify -> 127.0.0.1:3000
        # where nothing listened -> net::ERR_CONNECTION_REFUSED on every
        # sign-in (run 34858850901). Locally this never bit because the
        # dev server already runs on 3000 and reuseExistingServer picks it
        # up. Aligning the CI app port with site_url fixes the redirect
        # chain without touching the stack config.
        env:
          PLAYWRIGHT_PORT: "3000"
          # portal-approve.spec signs in via /dev-login, which (audit
          # SEC-001) requires this explicit opt-in on top of
          # NODE_ENV=development. Safe here: the target is the job's
          # ephemeral local Supabase stack, torn down right after.
          DEV_LOGIN_ENABLED: "true"
        run: |
          npx playwright install --with-deps
          npx playwright test

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
