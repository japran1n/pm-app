name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # F278: required for the integration (vitest) and e2e (Playwright)
      # suites to run against the real linked Supabase project instead of
      # being silently skipped. Must be set as repository secrets in GitHub
      # (Settings > Secrets and variables > Actions) — see
      # missions/20260818-213033/handoffs/F278-handoff.md for the exact
      # names and where the values come from. CI is intentionally NOT
      # tolerant of these being absent: tests/integration/*.test.ts and
      # tests/e2e/*.spec.ts hard-fail (rather than skip) when `CI` is set
      # and credentials are missing.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit + integration tests
        # F278: same command the local pre-worker-exit hook runs (see
        # tech-decisions.md "How to run tests"), kept in sync intentionally.
        # With NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        # / SUPABASE_SECRET_KEY present above, the integration suite (which
        # was previously silently `describe.skipIf`-skipped in CI) now runs
        # for real; if those secrets are absent, the affected test files
        # hard-fail instead of reporting green.
        run: npm run test

      - name: End-to-end tests (Playwright)
        run: |
          npx playwright install --with-deps
          npx playwright test
